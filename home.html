<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Issues-tracker | Home</title>

    <!-- tailwind & daisy ui -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- font awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        font-family: "Geist", sans-serif;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="bg-base-200 lg:mb-48 shadow-sm w-full rounded-md">
        <input id="navbar-1-toggle" class="peer hidden" type="checkbox" />
        <label
          for="navbar-1-toggle"
          class="fixed inset-0 hidden max-lg:peer-checked:block"
        ></label>
        <div class="collapse-title navbar">
          <div class="navbar-start">
            <!-- 
              <svg
                aria-label="Menu"
                xmlns="http://www.w3.org/2000/svg"
                class="h-5 w-5"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M4 6h16M4 12h8m-8 6h16"
                />
              </svg>
            </label> -->
            <div class="flex justify-center items-center">
              <img class="w-8 md:w-12" src="./assets/github-logo.png" alt="" />
              <button class="md:font-semibold ml-2 md:text-xl">
                Github Issue Tracker
              </button>
            </div>
          </div>

          <div class="navbar-end">
            <label class="input border">
              <svg
                class="h-[1em] opacity-50"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
              >
                <g
                  stroke-linejoin="round"
                  stroke-linecap="round"
                  stroke-width="2.5"
                  fill="none"
                  stroke="currentColor"
                >
                  <circle cx="11" cy="11" r="8"></circle>
                  <path d="m21 21-4.3-4.3"></path>
                </g>
              </svg>
              <input class="" type="search" required placeholder="Search" />
            </label>
            <button id="" class="btn btn-primary rounded-lg ml-4">
              + New Issue
            </button>
          </div>
        </div>
      </div>
    </header>

    <main></main>
  </body>
</html>
