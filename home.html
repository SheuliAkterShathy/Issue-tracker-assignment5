<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Issues-tracker | Home</title>

    <!-- tailwind & daisy ui -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- font awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        font-family: "Geist", sans-serif;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="bg-white shadow-sm w-full py-2 rounded-md">
        <input id="navbar-1-toggle" class="peer hidden" type="checkbox" />
        <label
          for="navbar-1-toggle"
          class="fixed inset-0 hidden max-lg:peer-checked:block"
        ></label>
        <div class="collapse-title navbar">
          <div class="navbar-start">
            <!-- 
              <svg
                aria-label="Menu"
                xmlns="http://www.w3.org/2000/svg"
                class="h-5 w-5"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M4 6h16M4 12h8m-8 6h16"
                />
              </svg>
            </label> -->
            <div class="flex justify-center items-center">
              <img class="w-8 md:w-12" src="./assets/github-logo.png" alt="" />
              <button class="md:font-semibold ml-2 md:text-xl">
                Github Issue Tracker
              </button>
            </div>
          </div>

          <div class="navbar-end">
            <label class="input border">
              <svg
                class="h-[1em] opacity-50"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
              >
                <g
                  stroke-linejoin="round"
                  stroke-linecap="round"
                  stroke-width="2.5"
                  fill="none"
                  stroke="currentColor"
                >
                  <circle cx="11" cy="11" r="8"></circle>
                  <path d="m21 21-4.3-4.3"></path>
                </g>
              </svg>
              <input class="" type="search" required placeholder="Search" />
            </label>
            <button id="" class="btn btn-primary rounded-lg ml-4">
              + New Issue
            </button>
          </div>
        </div>
      </div>
    </header>

    <main class="bg-[#f8fafc] py-14">
      <section class="w-[90%] mx-auto bg-[#fbfbfb]">
        <!-- all,open,closed buttons -->
        <div class="bg-white p-6 rounded-md">
          <button id="all-btn" class="btn btn-primary w-28">All</button>
          <button id="open-btn" class="btn w-28">Open</button>
          <button id="close-btn" class="btn w-28">Closed</button>
        </div>

        <!-- total issues and manage issues -->
        <div class="flex justify-between my-4 bg-white shadow p-6 rounded-md">
          <div class="flex items-center gap-2 w-[50%]">
            <div class="bg-slate-100 p-4 rounded-full">
              <img class="w-8" src="./assets/Aperture.png" alt="" />
            </div>
            <div>
              <h3 class="font-semibold text-xl">
                <span id="totalIssueLength">50</span> Issues
              </h3>
              <p class="">Track and manage your project issue</p>
            </div>
          </div>

          <!-- open and closed -->
          <div class="flex items-center gap-2 p-6">
            <!-- Open Status Badge -->
            <div
              class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-lg font-bold"
            >
              <span
                class="w-4 h-4 rounded-full bg-emerald-500 animate-pulse"
              ></span>
              <span>Open</span>
            </div>

            <!-- Closed Status Badge -->
            <div
              class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-lg font-bold"
            >
              <span
                class="w-4 h-4 rounded-full bg-purple-600 animate-pulse"
              ></span>
              <span>Closed</span>
            </div>
          </div>
        </div>

        <!-- loading spinner -->
        <div id="loading" class="text-center">
          <span class="loading loading-spinner loading-xl"></span>
        </div>

        <!-- load issues -->
        <div
          id="IssuesContainer"
          class="grid grid-cols-3 gap-8 shadow-md p-5"
        ></div>

        <!-- modal -->

        <!-- Modal -->
        <dialog id="issue_modal" class="modal">
          <!-- <div class="modal-box max-w-2xl p-7 rounded-2xl"> -->
            <!-- Close Icon -->
            <form method="dialog">
              <button
                class="btn btn-sm btn-circle btn-ghost absolute right-4 top-4 text-gray-500"
              >
                ✕
              </button>
            </form>

            <!-- Title -->
            <h3 class="text-2xl font-bold text-gray-800">
              Fix broken image uploads
            </h3>

            <!-- Status -->
            <div class="flex items-center gap-2 mt-3 text-sm text-gray-500">
              <span class="badge badge-success text-white"> ● Opened </span>

              <span>•</span>

              <span>Opened by Fahim Ahmed</span>

              <span>•</span>

              <span>22/02/2026</span>
            </div>

            <!-- Labels -->
            <div class="flex gap-3 mt-5">
              <span class="badge badge-error badge-outline px-4 py-3">
                🐞 BUG
              </span>

              <span class="badge badge-warning badge-outline px-4 py-3">
                🔗 HELP WANTED
              </span>
            </div>

            <!-- Description -->
            <p class="text-gray-500 leading-7 mt-5">
              The navigation menu doesn't collapse properly on mobile devices.
              Need to fix the responsive behavior.
            </p>

            <!-- Assignee & Priority -->
            <div class="bg-slate-50 rounded-xl p-5 mt-6 flex items-center">
              <!-- Assignee -->
              <div class="w-1/2">
                <p class="text-gray-500 text-sm">Assignee:</p>

                <p class="font-bold text-gray-800 mt-1">Fahim Ahmed</p>
              </div>

              <!-- Divider -->
              <div class="divider divider-horizontal"></div>

              <!-- Priority -->
              <div class="w-1/2">
                <p class="text-gray-500 text-sm">Priority:</p>

                <span class="badge badge-error text-white mt-1"> HIGH </span>
              </div>
            </div>

            <!-- Close Button -->
            <div class="modal-action">
              <form method="dialog">
                <button
                  class="btn bg-purple-600 hover:bg-purple-700 text-white border-none px-8"
                >
                  Close
                </button>
              </form>
            </div>
          <!-- </div> -->

          <!-- Background -->
          <!-- <form method="dialog" class="modal-backdrop"> -->
            <!-- <button>close</button> -->
          <!-- </form> -->
        </dialog>
      </section>
    </main>

    <script src="./script/issues.js"></script>
  </body>
</html>
