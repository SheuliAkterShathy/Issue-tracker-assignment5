<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Issues-tracker | Home</title>

    <!-- tailwind & daisy ui -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- font awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        font-family: "Geist", sans-serif;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="bg-white shadow-sm w-full py-2 rounded-md">
        <input id="navbar-1-toggle" class="peer hidden" type="checkbox" />
        <label
          for="navbar-1-toggle"
          class="fixed inset-0 hidden max-lg:peer-checked:block"
        ></label>
        <div class="collapse-title navbar">
          <div class="navbar-start">
            <!-- 
              <svg
                aria-label="Menu"
                xmlns="http://www.w3.org/2000/svg"
                class="h-5 w-5"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M4 6h16M4 12h8m-8 6h16"
                />
              </svg>
            </label> -->
            <div class="flex justify-center items-center">
              <img class="w-8 md:w-12" src="./assets/github-logo.png" alt="" />
              <button class="md:font-semibold ml-2 md:text-xl">
                Github Issue Tracker
              </button>
            </div>
          </div>

          <div class="navbar-end">
            <label class="input border">
              <svg
                class="h-[1em] opacity-50"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
              >
                <g
                  stroke-linejoin="round"
                  stroke-linecap="round"
                  stroke-width="2.5"
                  fill="none"
                  stroke="currentColor"
                >
                  <circle cx="11" cy="11" r="8"></circle>
                  <path d="m21 21-4.3-4.3"></path>
                </g>
              </svg>
              <input class="" type="search" required placeholder="Search" />
            </label>
            <button id="" class="btn btn-primary rounded-lg ml-4">
              + New Issue
            </button>
          </div>
        </div>
      </div>
    </header>

    <main class="bg-[#f8fafc] py-14">
      <section class="w-10/12 mx-auto bg-[#fbfbfb]">
        <!-- all,open,closed buttons -->
        <div class="bg-white p-6 rounded-md">
          <button id="all-btn" class="btn btn-primary w-28">All</button>
          <button id="open-btn" class="btn btn-primary w-28">Open</button>
          <button id="close-btn" class="btn btn-primary w-28">Closed</button>
        </div>

        <!-- total issues and manage issues -->
        <div class="flex justify-between my-4 bg-white shadow p-6 rounded-md">
          <div class="flex items-center gap-2 w-[50%]">
            <div class="bg-slate-100 p-4 rounded-full">
              <img class="w-8" src="./assets/Aperture.png" alt="" />
            </div>
            <div>
              <h3 class="font-semibold text-xl">50 Issues</h3>
              <p class="">Track and manage your project issue</p>
            </div>
          </div>

          <!-- open and closed -->
          <div class="flex items-center gap-2 p-6">
            <!-- Open Status Badge -->
            <div
              class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-lg font-bold"
            >
              <span
                class="w-4 h-4 rounded-full bg-emerald-500 animate-pulse"
              ></span>
              <span>Open</span>
            </div>

            <!-- Closed Status Badge -->
            <div
              class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-lg font-bold"
            >
              <span
                class="w-4 h-4 rounded-full bg-purple-600 animate-pulse"
              ></span>
              <span>Closed</span>
            </div>
          </div>
        </div>

        <!-- load issues -->
        <div id="IssuesContainer" class="grid grid-cols-3 gap-6 shadow-md p-5">
       
 <!-- <div class="bg-white shadow p-4 rounded-md">
            <div class="flex justify-between">
              <img class="w-6 h-6" src="./assets/Open-Status.png" alt="" />
              <button class="btn">high</button>
            </div>
            <h2 class="font-semibold">Fix Navigation menu on mobile device</h2>
            <p class="my-2">Lorem ipsum dolor sit amet.</p>
            <div class="badge badge-success">

              Success
            </div>
            <div class="badge badge-warning">

              Warning
            </div>
            
            <hr class="my-4 border-gray-400">
            <p>by jon doe</p>
            <p>1/1/23</p>
          </div> -->
    
        </div>
      </section>
    </main>

    <script src="./script/issues.js"></script>
  </body>
</html>
