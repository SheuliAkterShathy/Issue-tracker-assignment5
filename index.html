<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Issues-tracker | Login</title>

    <!-- tailwind & daisy ui -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- font awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        font-family: "Geist", sans-serif;
      }
    </style>
  </head>
  <body class="min-h-screen max-w-md bg-white mx-auto shadow-2xl">
    <div class="text-center">
      <img class="mx-auto py-7" src="./assets/github-logo.png" alt="" />
      <h3 class="text-2xl font-semibold">GitHub Issues Tracker</h3>
      <p class="text-[#64748B]">Sign in to manage your issues</p>
    </div>

    <div class="form">
      <div class="card w-full max-w-sm shrink-0 mx-auto rounded-2xl">
        <div class="card-body">
          <fieldset class="fieldset">
            <label class="label text-neutral font-bold">UserName</label>
            <input
              id="input-name"
              type="text"
              class="input rounded-lg"
              placeholder="Enter username"
            />
            <span class="text-[#4a00FF]">Default:admin</span>
            <!-- <br /> -->
            <label class="label text-neutral font-bold">Password</label>
            <input
              id="input-password"
              type="password"
              class="input rounded-lg"
              placeholder="Enter Password"
            />
            <span class="text-[#4a00FF]">Default:admin123</span>
            <button id="signIn-btn" class="btn btn-primary mt-4 rounded-lg">
              Sign In
            </button>
          </fieldset>
          <!-- OR -->
          <div class="flex items-center gap-3">
            <div class="flex-1 h-px bg-gray-200"></div>

            <span class="text-gray-500">OR</span>

            <div class="flex-1 h-px bg-gray-200"></div>
          </div>

          <!-- Demo Credentials -->
          <p class="text-center text-gray-500">Demo Credentials:</p>

          <div class="bg-gray-50 rounded-lg p-6 text-center">
            <p class="text-gray-800">
              <span class="font-bold">Username</span>: admin
              <br />
              <span class="font-bold">Password</span>: admin123
            </p>
          </div>
        </div>
      </div>
    </div>

    <script src="script/script.js"></script>
  </body>
</html>
